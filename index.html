<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Mis Finanzas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">💰 Mis Finanzas</div>
    <div class="month-picker">
      <button class="icon-btn" id="mesAnterior" aria-label="Mes anterior">‹</button>
      <label class="month-label">
        <span id="mesTexto"></span>
        <input type="month" id="mesInput" aria-label="Elegir mes">
      </label>
      <button class="icon-btn" id="mesSiguiente" aria-label="Mes siguiente">›</button>
    </div>
    <button class="icon-btn" id="btnAjustes" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="vista" class="container"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="resumen" class="active"><span>🏠</span>Inicio</button>
    <button data-tab="ingresos"><span>💵</span>Ingresos</button>
    <button data-tab="gastos"><span>🛒</span>Gastos</button>
    <button data-tab="gustos"><span>🎁</span>Gustos</button>
    <button data-tab="fijos"><span>📅</span>Fijos</button>
    <button data-tab="ahorros"><span>🐷</span>Ahorros</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitulo"></h2>
      <div id="modalCampos"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancelar">Cancelar</button>
        <button type="submit" class="btn primary" id="modalGuardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
